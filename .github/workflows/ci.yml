name: CI

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build i testy
    runs-on: ubuntu-latest

    # Baza jako service container. Rozwiazuje problem braku Dockera na maszynie
    # deweloperskiej: lokalnie testy celuja w baze ankietor_test, tutaj w kontener.
    # Wersja 15 celowo zgodna z serwerem deweloperskim.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ankietor_test
          POSTGRES_USER: ankietor
          POSTGRES_PASSWORD: ankietor
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # pg_trgm i unaccent sa w standardowej dystrybucji contrib, wiec obraz
      # postgres:15 je zawiera. Migracja V1 zaklada je przez CREATE EXTENSION
      # IF NOT EXISTS, a uzytkownik w kontenerze jest superuserem, wiec przejdzie
      # bez dodatkowego kroku. Ten krok jest wylacznie weryfikacja zalozenia.
      - name: Sprawdz dostepnosc rozszerzen
        env:
          PGPASSWORD: ankietor
        run: |
          psql -h localhost -U ankietor -d ankietor_test -tAc \
            "SELECT name FROM pg_available_extensions WHERE name IN ('pg_trgm','unaccent') ORDER BY name" \
            | tee /tmp/ext.txt
          test "$(wc -l < /tmp/ext.txt)" -eq 2

      - name: Build i testy
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/ankietor_test
          TEST_DB_USER: ankietor
          TEST_DB_PASSWORD: ankietor
        run: mvn -B --no-transfer-progress clean verify

      - name: Raporty z testow
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
