<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ankietor — logowanie</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/adminlte/adminlte.min.css}">
</head>
<body class="login-page bg-body-secondary d-flex align-items-center justify-content-center min-vh-100">

<div class="login-box" style="max-width: 380px; width: 100%;">

    <div class="text-center mb-4">
        <i class="bi bi-clipboard-check fs-1 text-primary"></i>
        <h2 class="mt-2 mb-0 fw-light">Ankietor</h2>
        <p class="text-body-secondary small mb-0">Propozycje odpowiedzi na pytania z ankiet</p>
    </div>

    <div class="card">
        <div class="card-body login-card-body">

            <div th:if="${param.error}" class="alert alert-danger py-2 small mb-3" role="alert">
                <i class="bi bi-exclamation-triangle me-1"></i>
                Nieprawidlowy login lub haslo.
            </div>
            <div th:if="${param.logout}" class="alert alert-info py-2 small mb-3" role="alert">
                <i class="bi bi-info-circle me-1"></i>
                Zostales wylogowany.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label small">Login</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" id="username" name="username" class="form-control"
                               autocomplete="username" autofocus required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label small">Haslo</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" name="password" class="form-control"
                               autocomplete="current-password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Zaloguj
                </button>
            </form>

        </div>
    </div>
</div>

<script th:src="@{/vendor/bootstrap/bootstrap.bundle.min.js}"></script>
</body>
</html>
