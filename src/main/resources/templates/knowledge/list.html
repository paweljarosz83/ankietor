<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: html(tytul='Baza wiedzy', podtytul='Liczba par pytanie-odpowiedz: ' + ${total}, aktywny='baza', zawartosc=~{::zawartosc})}">
<body>
<th:block th:fragment="zawartosc">

    <div class="d-flex justify-content-end mb-3">
        <a th:href="@{/baza-wiedzy/nowa}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i> Dodaj pare
        </a>
    </div>

    <div th:if="${pary.isEmpty()}" class="card">
        <div class="card-body text-center py-5">
            <i class="bi bi-inbox fs-1 text-body-tertiary"></i>
            <p class="mt-3 mb-1 fw-semibold">Baza wiedzy jest pusta</p>
            <p class="text-body-secondary small mb-3">
                Dopasowywanie pytan nie ma jeszcze czego proponowac.
                Dodaj pierwsza pare albo wczytaj dane startowe.
            </p>
            <a th:href="@{/baza-wiedzy/nowa}" class="btn btn-outline-primary btn-sm">Dodaj pierwsza pare</a>
        </div>
    </div>

    <div th:unless="${pary.isEmpty()}" class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th style="width: 42%">Pytanie</th>
                        <th style="width: 38%">Odpowiedz</th>
                        <th style="width: 10%">Dodano</th>
                        <th style="width: 10%" class="text-end">Akcje</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="para : ${pary.content}">
                        <td>
                            <span class="fw-medium" th:text="${para.question}">pytanie</span>
                        </td>
                        <td>
                            <span class="text-body-secondary small" th:text="${para.answer}">odpowiedz</span>
                        </td>
                        <td class="small text-body-tertiary text-nowrap"
                            th:text="${#temporals.format(para.createdAt, 'dd.MM.yyyy')}">data</td>
                        <td class="text-end text-nowrap">
                            <a th:href="@{/baza-wiedzy/{id}/edycja(id=${para.id})}"
                               class="btn btn-sm btn-outline-secondary" title="Edytuj">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/baza-wiedzy/{id}/usun(id=${para.id})}" method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('Usunac te pare pytanie-odpowiedz?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Usun">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card-footer d-flex justify-content-between align-items-center"
             th:if="${pary.totalPages > 1}">
            <span class="small text-body-secondary"
                  th:text="'Strona ' + (${pary.number} + 1) + ' z ' + ${pary.totalPages}">strony</span>
            <div class="btn-group btn-group-sm">
                <a th:href="@{/baza-wiedzy(page=${pary.number - 1})}"
                   class="btn btn-outline-secondary"
                   th:classappend="${pary.first} ? 'disabled'">
                    <i class="bi bi-chevron-left"></i> Poprzednia
                </a>
                <a th:href="@{/baza-wiedzy(page=${pary.number + 1})}"
                   class="btn btn-outline-secondary"
                   th:classappend="${pary.last} ? 'disabled'">
                    Nastepna <i class="bi bi-chevron-right"></i>
                </a>
            </div>
        </div>
    </div>

</th:block>
</body>
</html>
