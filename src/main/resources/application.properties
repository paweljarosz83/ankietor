spring.application.name=ankietor

# --- Baza danych -------------------------------------------------------------
# Wartosci pochodza ze zmiennych srodowiskowych. Nigdy nie wpisuj tu hasel.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ankietor}
spring.datasource.username=${DB_USER:ankietor}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA ---------------------------------------------------------------------
# validate: schemat kontroluje Flyway, Hibernate tylko sprawdza zgodnosc.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Dopasowanie pytan -------------------------------------------------------
# lexical  - pg_trgm, dziala bez zaleznosci zewnetrznych (domyslny)
# semantic - embeddingi + pgvector, wymaga dostawcy embeddingow
# hybrid   - leksykalny jako baza, semantyczny jako warstwa podnoszaca ranking
ankietor.matching.mode=lexical
ankietor.matching.max-results=5
# 0.52 wyznaczone empirycznie na danych startowych: najnizsze prawdziwe trafienie
# 55%, najwyzsze falszywe 50%. Szczegoly w prd.md, sekcja 8.
ankietor.matching.min-similarity=0.52

# --- Widoki ------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.messages.basename=messages
spring.messages.encoding=UTF-8
