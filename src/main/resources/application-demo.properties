# Profil demonstracyjny - uruchomienie bez ustawiania czegokolwiek.
#
#     mvn spring-boot:run -Dspring-boot.run.profiles=demo
#
# Wymaga jedynie wczesniejszego puszczenia db/setup/00_baza_i_rola.sql.
#
# Wartosci ponizej dotycza bazy na localhoscie zalozonej tamtym skryptem. To nie sa
# sekrety zadnego srodowiska. Bez tego profilu aplikacja czyta DB_PASSWORD
# i ANKIETOR_ADMIN_PASSWORD ze zmiennych srodowiskowych, a haslo administratora
# przy braku zmiennej jest losowane.

spring.datasource.username=ankietor
spring.datasource.password=ankietor-demo

# Dokladane db/demo z kontami i przykladowymi ankietami. Domyslna sciezka Flyway
# tego katalogu nie zawiera, wiec uruchomienie produkcyjne go nie wykona.
spring.flyway.locations=classpath:db/migration,classpath:db/demo
