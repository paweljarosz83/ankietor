# Testy dzialaja przeciw osobnej bazie. Adres i credentiale wylacznie ze zmiennych
# srodowiskowych - lokalnie wskazuja baze deweloperska, w CI service container.
spring.datasource.url=${TEST_DB_URL}
spring.datasource.username=${TEST_DB_USER}
spring.datasource.password=${TEST_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.clean-disabled=false

ankietor.matching.mode=lexical
ankietor.matching.max-results=5
ankietor.matching.min-similarity=0.52

logging.level.org.hibernate.SQL=warn
